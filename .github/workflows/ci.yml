name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  DO_NOT_TRACK: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  LEFTHOOK: "0"

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: atomes
          POSTGRES_PASSWORD: atomes
          POSTGRES_DB: atomes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atomes -d atomes"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://atomes:atomes@localhost:5432/atomes
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Lint and format (Biome)
        run: pnpm exec biome ci .

      - name: Type check
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Migrations match the schema
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            echo "::error::The Drizzle schema changed without a migration. Run 'pnpm db:generate' and commit the result."
            git status --porcelain packages/db/drizzle
            exit 1
          fi

  pact-solver:
    name: Pact solver (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/pact-solver
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        run: pipx install uv==0.8.17

      - name: Dependencies (with OR-Tools)
        run: uv sync --frozen --extra cpsat

      - name: Lint and format (Ruff)
        run: uv run --frozen ruff check . && uv run --frozen ruff format --check .

      - name: Tests (pytest)
        run: uv run --frozen pytest -q

  web:
    name: Build and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Local configuration
        run: cp .env.example .env

      - name: Start local services (PostgreSQL, Valkey, Centrifugo, SeaweedFS, imgproxy, Mailpit)
        run: pnpm services:up

      - name: Migrate and seed
        run: pnpm db:migrate && pnpm db:seed

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @atomes/web exec playwright install --with-deps chromium

      - name: End-to-end tests (Playwright + axe)
        run: pnpm test:e2e

      - name: Service logs
        if: failure()
        run: docker compose -f infra/compose/compose.yaml logs --tail 100

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
