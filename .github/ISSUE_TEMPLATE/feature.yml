name: Fonctionnalité
description: Une fonctionnalité du catalogue (docs/01-fonctionnalites.md) ou une nouvelle idée.
labels: ["feature"]
body:
  - type: input
    id: feature-id
    attributes:
      label: Identifiant
      description: Identifiant du catalogue, par exemple DEC-02. Laisser vide pour une nouvelle idée.
  - type: dropdown
    id: priority
    attributes:
      label: Priorité
      options: [P0, P1, P2, R&D]
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Objectif
      description: Le problème résolu, pour qui.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critères d'acceptation
      placeholder: "- [ ] …"
    validations:
      required: true
  - type: textarea
    id: threats
    attributes:
      label: Risques sécurité et vie privée
      description: Mini-analyse de menaces (docs/07-confiance-securite.md). Quels abus possibles ? Quelles données personnelles ?
    validations:
      required: true
