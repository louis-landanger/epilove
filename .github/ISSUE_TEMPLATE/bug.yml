name: Bug
description: Quelque chose ne fonctionne pas comme prévu.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Une faille de sécurité ou un problème touchant des données personnelles ne se signale pas ici :
        utiliser le signalement privé (voir SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: Ce qui se passe
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ce qui devrait se passer
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: "1. …"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environnement
      description: Appareil, navigateur, version de l'application.
