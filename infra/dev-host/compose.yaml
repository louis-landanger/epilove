# Shared development server (ADR 0014): layered over infra/compose/compose.yaml.
# The development secrets of the base file are replaced by the ones generated by
# setup.sh (infra/dev-host/generated/services.env, git-ignored). Ports stay bound
# to 127.0.0.1: only Caddy (80, 443) faces the Internet.
# Paths are relative to infra/compose, the project directory.

services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run infra/dev-host/setup.sh}

  valkey:
    restart: unless-stopped

  centrifugo:
    restart: unless-stopped
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_SECRET:?run infra/dev-host/setup.sh}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_HTTP_API_KEY:?run infra/dev-host/setup.sh}
      # Replaces the localhost origins of infra/centrifugo/config.json.
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${APP_URL:?run infra/dev-host/setup.sh}

  seaweedfs:
    restart: unless-stopped
    volumes:
      - ../dev-host/generated/s3.json:/etc/seaweedfs/s3.json:ro

  imgproxy:
    restart: unless-stopped
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY:?run infra/dev-host/setup.sh}
      IMGPROXY_SALT: ${IMGPROXY_SALT:?run infra/dev-host/setup.sh}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?run infra/dev-host/setup.sh}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run infra/dev-host/setup.sh}

  mailpit:
    restart: unless-stopped
