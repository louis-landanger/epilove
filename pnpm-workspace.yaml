packages:
  - apps/*
  - packages/*

# Exact versions only: upgrades go through Renovate pull requests.
savePrefix: ""

# Supply-chain safety: ignore package versions published less than 24 hours ago.
minimumReleaseAge: 1440

# Dependencies allowed to run install scripts. Anything else fails the install
# (strictDepBuilds) until it has been reviewed and added here.
allowBuilds:
  # Reviewed and refused: prebuilt binaries are used instead (pulled in by next-intl's extractor).
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: true
  # Reviewed and refused: its postinstall only prints a version notice (pulled in by centrifuge).
  protobufjs: false
  lefthook: true

# Shared dependency versions, referenced as "catalog:" in package.json files.
catalog:
  '@anthropic-ai/sdk': 0.131.0
  '@axe-core/playwright': 4.13.0
  '@orpc/client': 1.15.4
  '@orpc/contract': 1.15.4
  '@orpc/server': 1.15.4
  '@orpc/tanstack-query': 1.15.4
  '@playwright/test': 1.63.0
  '@serwist/turbopack': 9.5.12
  '@tailwindcss/postcss': 4.3.3
  '@tanstack/react-query': 5.104.0
  '@types/node': 24.19.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@types/web-push': 3.6.4
