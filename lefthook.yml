# Git hooks, installed automatically by `pnpm install`.
pre-commit:
  commands:
    biome:
      glob: "*.{js,ts,tsx,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    conventional-commit:
      run: >-
        head -1 {1} | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
        || (echo "Commit message must follow Conventional Commits, e.g. 'feat(core): add canSee policy'." && exit 1)
